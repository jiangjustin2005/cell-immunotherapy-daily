name: 细胞免疫治疗每日日报

on:
  schedule:
    - cron: '30 8 * * *'
      timezone: Asia/Shanghai    # 北京时间早上8:30
  workflow_dispatch:            # 允许手动测试运行

jobs:
  run-daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行日报程序
        env:
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
